name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # SECURITY & LINTING STAGE
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run security scan
        run: |
          echo "Running security scan..."
          # Check for hardcoded secrets (prevent accidental commits)
          if grep -r "sk_live_\|sk_test_\|whsec_\|AKIA" --include="*.js" --include="*.ts" --include="*.json" . 2>/dev/null; then
            echo "ERROR: Potential hardcoded secrets found"
            exit 1
          fi
          echo "Security scan passed"

      - name: Dependency vulnerability scan
        run: |
          echo "Running dependency vulnerability scan..."
          # Block merge on HIGH-severity dependency vulnerabilities (DO-EC-04)
          npm audit --audit-level=high

  # ============================================================================
  # LINT & FORMAT STAGE
  # ============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

  # ============================================================================
  # TYPE CHECK STAGE
  # ============================================================================
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript type checker
        run: npm run typecheck

  # ============================================================================
  # UNIT TESTS STAGE
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # ============================================================================
  # BUILD STAGE
  # ============================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build backend
        run: |
          cd apps/backend
          npm run build

      - name: Build frontend
        run: |
          cd apps/frontend
          npm run build

      - name: Build database migrations
        run: |
          cd packages/db
          npm run build || true

      - name: Run Terraform validation
        run: |
          cd infrastructure/terraform
          terraform init -backend=false
          terraform validate

      - name: Terraform plan (demo)
        run: |
          cd infrastructure/terraform
          terraform plan -var-file=demo.tfvars -out=tfplan-demo

      - name: Terraform plan (staging)
        run: |
          cd infrastructure/terraform
          terraform plan -var-file=staging.tfvars -out=tfplan-staging

      - name: Terraform plan (production)
        run: |
          cd infrastructure/terraform
          terraform plan -var-file=production.tfvars -out=tfplan-production

  # ============================================================================
  # DOCKER BUILD STAGE
  # ============================================================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # DEPLOY STAGE (triggered on merge to release branches)
  # ============================================================================
  deploy:
    name: Deploy to Infrastructure
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "tfvars=staging.tfvars" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release/.*$ ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "tfvars=production.tfvars" >> $GITHUB_OUTPUT
          fi

      - name: Initialize Terraform
        run: |
          cd infrastructure/terraform
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=finly-${{ steps.env.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=terraform-locks"

      - name: Plan Infrastructure Changes
        run: |
          cd infrastructure/terraform
          terraform plan \
            -var-file="${{ steps.env.outputs.tfvars }}" \
            -out=tfplan

      - name: Apply Infrastructure Changes
        if: github.event_name == 'push'
        run: |
          cd infrastructure/terraform
          terraform apply -auto-approve tfplan

      - name: Run Database Migrations
        if: github.event_name == 'push'
        run: |
          cd packages/db
          npm run migrate

      - name: Terraform Output
        run: |
          cd infrastructure/terraform
          terraform output -json | jq '.alb_dns_name.value' || echo "ALB DNS will be available after initial apply"
